services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: composition_evaluator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d composition_evaluator"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/composition_evaluator}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports:
      - "8000:8000"

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    env_file:
      - .env
    environment:
      DATABASE_URL: ${BACKEND_TEST_DATABASE_URL:-sqlite+pysqlite:///./composition_evaluator_test.db}
      REDIS_URL: ${BACKEND_TEST_REDIS_URL:-redis://localhost:6379/0}

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Composition Evaluator}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
